function fmt(base,code=currency){return new Intl.NumberFormat('zh-CN',{style:'currency',currency:code,currencyDisplay:'narrowSymbol',minimumFractionDigits:2}).format(base/rates[code]);}
function raw(amount,code){return new Intl.NumberFormat('zh-CN',{style:'currency',currency:code,currencyDisplay:'code'}).format(amount);}
const base = e => e.amount*rates[e.currency];
function sum(kind){return entries.filter(e=>e.kind===kind).reduce((n,e)=>n+base(e),0);}

function note(text){return '<div class="note"><span class="dot"></span><span>'+text+'</span></div>';}
function categoryTotals(){const out={};for(const e of entries.filter(e=>e.kind==='expense'))out[e.category]=(out[e.category]||0)+base(e);return Object.entries(out).sort((a,b)=>b[1]-a[1]);}
function filtered(){return entries.filter(e=>(!filter||e.category===filter)&&(weekFilter===null||Math.min(3,Math.floor((Number(e.date.slice(-2))-1)/7))===weekFilter)&&(kindFilter==='all'||e.kind===kindFilter)&&(!search||(e.merchant+e.category).toLowerCase().includes(search.toLowerCase()))).sort((a,b)=>b.date.localeCompare(a.date)||b.id-a.id);}

function weekTotals(){

});
document.addEventListener('input',e=>{if(e.target.id==='search'){search=e.target.value;$('transactions-table').innerHTML=table(filtered());$('result-count').textContent=filtered().length+' 笔账目';}if(e.target.id==='amount')updatePreview();});
document.addEventListener('change',e=>{if(e.target.id==='currency'){currency=e.target.value;render();}if(e.target.id==='category-filter'){filter=e.target.value;render();}if(e.target.id==='kind-filter'){kindFilter=e.target.value;render();}if(e.target.id==='entry-currency')updatePreview();});
$('theme').addEventListener('click',()=>{document.body.classList.toggle('dark');$('theme').setAttribute('aria-pressed',String(document.body.classList.contains('dark')));syncCharts();});
$('entry-form').addEventListener('submit',e=>{e.preventDefault();const s=$('amount').value.trim(),amount=Number(s);if(!/^\d+(\.\d{1,2})?$/.test(s)||amount<=0||amount>10000000){$('form-error').textContent='请输入大于 0、最多两位小数且不超过一千万的演示金额。';return;}const c=$('entry-currency').value;entries.unshift({id:Date.now(),date:$('entry-date').value,merchant:$('merchant').value.trim(),category:$('category').value,kind:$('kind').value,amount,currency:c,account:c==='CNY'?'日常账户':c==='USD'?'美元账户':'港币钱包'});filter='';search='';kindFilter='all';weekFilter=null;$('entry').close();go('transactions');toast('演示账目已保存，刷新页面后恢复。');});
for(const id of ['entry','info'])$(id).addEventListener('close',()=>{if(lastFocus?.isConnected)lastFocus.focus();});
document.addEventListener('keydown',e=>{if(e.key==='n'&&!['INPUT','SELECT','TEXTAREA'].includes(document.activeElement.tagName)&&!$('entry').open&&!$('info').open){e.preventDefault();openEntry();}});
render(true);
})();
</script>
</body>
</html>
