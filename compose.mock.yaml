# Local protocol mocks for every third-party service (FX provider, Telegram, Feishu, WeCom, pushplus, webhook
# receiver, SMTP). Used by
# `pnpm test:e2e` and for local demos: docker compose -f compose.yaml -f compose.mock.yaml up -d --build --wait
# Production deployments never include this file; they configure real provider URLs and credentials instead.
services:
  mock-services:
    build: { context: ., target: mock-services }
    init: true
    environment:
      MOCK_PORT: '4010'
      MOCK_SMTP_PORT: '2525'
      MOCK_FIXER_KEY: mock-fixer-key
      MOCK_FEISHU_SECRET: mock-feishu-signing-secret
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:4010/__health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
  worker:
    environment:
      FX_PROVIDER_URL: http://mock-services:4010/fixer
      FX_PROVIDER_KEY: mock-fixer-key
      # Official provider origins are rewritten to the mocks; users still enter the real provider URLs.
      CHANNEL_ENDPOINT_OVERRIDES: https://api.telegram.org=http://mock-services:4010/telegram,https://open.feishu.cn=http://mock-services:4010/feishu,https://qyapi.weixin.qq.com=http://mock-services:4010/wecom,https://www.pushplus.plus=http://mock-services:4010/pushplus
      SMTP_URL: smtp://mock-services:2525
      WEBHOOK_ALLOWLIST: mock-services:4010
    depends_on:
      mock-services: { condition: service_healthy }
  web:
    environment:
      CHANNEL_ENDPOINT_OVERRIDES: https://api.telegram.org=http://mock-services:4010/telegram,https://open.feishu.cn=http://mock-services:4010/feishu,https://qyapi.weixin.qq.com=http://mock-services:4010/wecom,https://www.pushplus.plus=http://mock-services:4010/pushplus
      WEBHOOK_ALLOWLIST: mock-services:4010
