services:
  web:
    ports: !override []
    restart: "no"
    environment:
      LEDGER_ADMIN_EMAILS: admin-e2e@example.test
  mysql:
    restart: "no"
  redis:
    restart: "no"
  worker:
    restart: "no"
    environment:
      # Fast schedule so the suite can observe fetches, failures and recovery within seconds.
      FX_POLL_SECONDS: "2"
      FX_STALE_FAILURES: "3"
      FX_TIMEOUT_MS: "1500"
      # Reminders: a short tick and provider timeout so retries, timeouts and recovery are observable quickly.
      NOTIFY_TICK_SECONDS: "1"
      CHANNEL_TIMEOUT_MS: "1500"
  mock-services:
    restart: "no"
  tests:
    build: { context: ., target: tests }
    environment:
      BASE_URL: http://web:3000
      # Isolated test database for the MySQL integration suite.
      DATABASE_URL: mysql://${MYSQL_USER}:${MYSQL_PASSWORD}@mysql:3306/${MYSQL_DATABASE}
      APP_ORIGIN: http://web:3000
      MOCK_URL: http://mock-services:4010
      REDIS_URL: redis://redis:6379
      # Integration tests keep their FX batches under their own provider name; the worker owns "fixer".
      FX_PROVIDER: itest
      FX_PROVIDER_URL: http://mock-services:4010/fixer
      FX_PROVIDER_KEY: mock-fixer-key
      LEDGER_ENCRYPTION_KEYS: ${LEDGER_ENCRYPTION_KEYS}
      WEBHOOK_ALLOWLIST: mock-services:4010
      CHANNEL_ENDPOINT_OVERRIDES: https://api.telegram.org=http://mock-services:4010/telegram,https://open.feishu.cn=http://mock-services:4010/feishu,https://qyapi.weixin.qq.com=http://mock-services:4010/wecom,https://www.pushplus.plus=http://mock-services:4010/pushplus
      SMTP_URL: smtp://mock-services:2525
      CHANNEL_TIMEOUT_MS: "1500"
      CI: "1"
      PERSISTENCE_EMAIL: ${PERSISTENCE_EMAIL:-}
      PERSISTENCE_PASSWORD: ${PERSISTENCE_PASSWORD:-}
    depends_on:
      web: { condition: service_healthy }
      worker: { condition: service_healthy }
    volumes:
      - ./test-results:/app/test-results
      - ./playwright-report:/app/playwright-report
    init: true
    shm_size: 1gb
