name: ledger-next
x-app-env: &app-env
  DATABASE_URL: mysql://${MYSQL_USER:-ledger}:${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in .env}@mysql:3306/${MYSQL_DATABASE:-ledger}
  REDIS_URL: redis://redis:6379
  APP_URL: ${APP_URL:-http://localhost:3000}
  BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?Set BETTER_AUTH_SECRET in .env}
  # Third-party endpoints stay empty unless configured; compose.mock.yaml points them at local mocks.
  FX_PROVIDER_URL: ${FX_PROVIDER_URL:-}
  FX_PROVIDER_KEY: ${FX_PROVIDER_KEY:-}
  LEDGER_ADMIN_EMAILS: ${LEDGER_ADMIN_EMAILS:-}
  # Notification channels (M5): credentials are sealed with these master keys ("id:base64(32 bytes)", first encrypts).
  LEDGER_ENCRYPTION_KEYS: ${LEDGER_ENCRYPTION_KEYS:?Set LEDGER_ENCRYPTION_KEYS in .env}
  SMTP_URL: ${SMTP_URL:-}
  SMTP_FROM: ${SMTP_FROM:-Ledger Next <no-reply@localhost>}
  # Private-network webhook receivers need an explicit allowlist (host or host:port); empty means public HTTPS only.
  WEBHOOK_ALLOWLIST: ${WEBHOOK_ALLOWLIST:-}
  CHANNEL_ENDPOINT_OVERRIDES: ${CHANNEL_ENDPOINT_OVERRIDES:-}
services:
  mysql:
    image: mysql:8.4@sha256:6ea90827b1100f8f2ae306a539f86d2c264a26ed435a2a9f75551dd5c3aeb242 # 8.4.11 LTS, multi-platform index
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-ledger}
      MYSQL_USER: ${MYSQL_USER:-ledger}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in .env}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in .env}
      TZ: UTC
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_0900_bin", "--default-time-zone=+00:00"]
    volumes: ["mysql-data:/var/lib/mysql"]
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=$$MYSQL_PASSWORD mysql -u$$MYSQL_USER -D$$MYSQL_DATABASE -e 'SELECT 1' >/dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 30
    restart: unless-stopped
  redis:
    image: redis:8-alpine@sha256:3811787313eba226a2ef38658c6ccb91cd5e110edc89c37767de373120a0e5a0 # 8.10.2, multi-platform index
    command: ["redis-server", "--appendonly", "yes"]
    volumes: ["redis-data:/data"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 15
    restart: unless-stopped
  migrate:
    build: { context: ., target: migrate }
    environment: *app-env
    depends_on:
      mysql: { condition: service_healthy }
    restart: "no"
  web:
    build: { context: ., target: web }
    init: true
    environment: *app-env
    ports: ["127.0.0.1:${WEB_PORT:-3000}:3000"]
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped
  worker:
    build: { context: ., target: worker }
    init: true
    environment: *app-env
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "node", "-e", "const fs=require('fs');process.exit(Date.now()-Number(fs.readFileSync('/tmp/ledger-worker-health','utf8'))<30000?0:1)"]
      interval: 10s
      timeout: 3s
      retries: 10
    restart: unless-stopped
volumes:
  mysql-data:
  redis-data:
